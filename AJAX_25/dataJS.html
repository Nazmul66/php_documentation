<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body>

    <div class="ajax_form">
       <div class="container">
        <div class="row">
            <div class="col-lg-8 offset-lg-2">
                <form action="">
                    <div class="form-floating">
                        <label for="floatingTextarea2">Comments</label>
                        <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea2" style="height: 100px"></textarea>
                    </div>
                    <pre id="result"></pre>
                    <input type="submit" id="send" class="mt-3 btn btn-success" value="Send Data">
                </form>
            </div>
        </div>
       </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>

    <script>

        function sendData(){
            let params = {
                'key1':'Value 1',
                'key2':'Value 2',
                'key3':'Value 3'
            }

            let queryString = formatQueryString(params);

            let xhr = new XMLHttpRequest();
        // GET method send
        //     xhr.open("GET","data.php?foo=bar&hello=world", true);
        //     xhr.onreadystatechange = function(){
        //         if(this.readyState == 4 && this.status == 200){
        //         //    console.log(this.responseText);
        //          document.getElementById("result").innerText = this.responseText;

        //            let response = JSON.parse(this.responseText);
        //            console.log(response.result)
        //         }
        //     }

        //     xhr.send();

            // POST method send
            // xhr.open("POST","data.php", true);

            // DELETE method send
            xhr.open("POST","data.php", true);
            xhr.setRequestHeader(
                'content-type', 
                'application/x-www-form-urlencoded'
            );
            xhr.onreadystatechange = function(){
                if(this.readyState == 4 && this.status == 200){
                //    console.log(this.responseText);
                 document.getElementById("result").innerText = this.responseText;

                   let response = JSON.parse(this.responseText);
                   console.log(response.result);
                }
            }

            xhr.send(queryString); // only POST method could add the value
        }


        // create search params
        function formatQueryString(params){
            // 2 method way to build params string
            return new URLSearchParams(params).toString();

        //    return Object.keys(params).map(function(key){
        //        return key + '=' + params[key];
        //    }).join('&');
        }



        document.getElementById("send").addEventListener("click", function(e){
            e.preventDefault();
            sendData();
        })
    </script>
</body>
</html>
